services:  
  postgresdb:
    image: postgres:18
    restart: always
    env_file: ./.env
    environment:
      - POSTGRES_USER=$DB_USERNAME
      - POSTGRES_PASSWORD=$DB_PASSWORD
      - POSTGRES_DB=$DB_NAME
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgres
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    depends_on:
      - postgresdb
    build: .
    volumes:
      - ./:/app
    restart: always
    env_file: ./.env
    environment:
      - DB_HOST=postgresdb
      - DB_USERNAME=$DB_USERNAME
      - DB_PASSWORD=$DB_PASSWORD
      - DB_PORT=$DB_PORT
      - DB_NAME=$DB_NAME
    ports:
      - $PORT:$PORT
    stdin_open: true
    tty: true

volumes:
  db: