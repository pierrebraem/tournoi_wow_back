name: ci

on:
    pull_request:
        branches:
            - dev

jobs:
    eslint:
      runs-on: ubuntu-24.04
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node 26
          uses: actions/setup-node@v4
          with:
            node-version: 26

        - name: Install dependencies
          run: npm ci

        - name: Run Eslint
          uses: sibiraj-s/action-eslint@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}
            extensions: js
            package-manager: npm
          
    tests:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Setup Node 26
              uses: actions/setup-node@v4
              with:
                node-version: 26
            
            - name: Install dependencies
              run: npm install

            - name: Run Jest tests
              run: npm test